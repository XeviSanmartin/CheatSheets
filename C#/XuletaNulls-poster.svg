<?xml version="1.0" encoding="UTF-8"?>
<!-- Xuleta pòster: els nulls en C#. A4 vertical. Editable amb Inkscape. -->
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123">
