  </g>
  <text x="397" y="64" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="29" font-weight="700" fill="#ffffff">Els nulls en C#</text>
  <text x="397" y="88" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#ece8ff">Mode Nullable actiu: si una dada pot no existir, el seu tipus ha de portar  ?</text>

  <!-- ================= FLUX DE 3 PASSOS (esquerra) ================= -->
  <text x="28" y="136" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5px" font-weight="700" fill="#4a3fb8">EL CAMÍ SEGUR, EN TRES PASSOS</text>

  <!-- pas 1 -->
  <g filter="url(#ombra)">
    <rect x="28" y="148" width="436" height="112" rx="10" fill="#ffffff" stroke="#e3e1ef" stroke-width="1"/>
  </g>
  <rect x="28" y="148" width="436" height="5" rx="2.5" fill="#6c5ce7"/>
  <circle cx="54" cy="180" r="13" fill="#6c5ce7"/>
  <text x="54" y="185" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="76" y="185" font-family="'Segoe UI',Arial,sans-serif" font-size="15px" font-weight="700" fill="#6c5ce7">Declara-la amb ?</text>
  <rect x="44" y="198" width="404" height="50" rx="4" fill="#fbfbfe" stroke="#d5d5e0" stroke-width="1"/>
  <rect x="44" y="198" width="3" height="50" rx="1.5" fill="#6c5ce7"/>
  <text x="56" y="216" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve"><tspan fill="#0000ff" font-weight="700">string</tspan>? nom = <tspan fill="#2b91af">Console</tspan>.<tspan fill="#74531f" font-weight="700">ReadLine</tspan>();  <tspan fill="#008000" font-style="italic">// pot ser null</tspan></text>
  <text x="56" y="236" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve"><tspan fill="#0000ff" font-weight="700">int</tspan>? nota = <tspan fill="#0000ff" font-weight="700">null</tspan>;                 <tspan fill="#008000" font-style="italic">// encara sense nota</tspan></text>

  <line x1="246" y1="262" x2="246" y2="284" stroke="#6c5ce7" stroke-width="2" marker-end="url(#fletxa)"/>

  <!-- pas 2 -->
  <g filter="url(#ombra)">
    <rect x="28" y="292" width="436" height="132" rx="10" fill="#ffffff" stroke="#e3e1ef" stroke-width="1"/>
  </g>
  <rect x="28" y="292" width="436" height="5" rx="2.5" fill="#6c5ce7"/>
  <circle cx="54" cy="324" r="13" fill="#6c5ce7"/>
  <text x="54" y="329" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="76" y="329" font-family="'Segoe UI',Arial,sans-serif" font-size="15px" font-weight="700" fill="#6c5ce7">Comprova-la</text>
  <rect x="44" y="342" width="404" height="70" rx="4" fill="#fbfbfe" stroke="#d5d5e0" stroke-width="1"/>
  <rect x="44" y="342" width="3" height="70" rx="1.5" fill="#6c5ce7"/>
  <text x="56" y="360" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve"><tspan fill="#0000ff" font-weight="700">if</tspan> (nom != <tspan fill="#0000ff" font-weight="700">null</tspan>)</text>
  <text x="56" y="376" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve">{</text>
  <text x="56" y="392" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve">    <tspan fill="#2b91af">Console</tspan>.<tspan fill="#74531f" font-weight="700">WriteLine</tspan>(nom.<tspan fill="#2b91af">Length</tspan>);</text>
  <text x="56" y="408" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve">}</text>

  <line x1="246" y1="426" x2="246" y2="448" stroke="#6c5ce7" stroke-width="2" marker-end="url(#fletxa)"/>

  <!-- pas 3 -->
  <g filter="url(#ombra)">
    <rect x="28" y="456" width="436" height="104" rx="10" fill="#ffffff" stroke="#e3e1ef" stroke-width="1"/>
  </g>
  <rect x="28" y="456" width="436" height="5" rx="2.5" fill="#6c5ce7"/>
  <circle cx="54" cy="488" r="13" fill="#6c5ce7"/>
  <text x="54" y="493" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="76" y="493" font-family="'Segoe UI',Arial,sans-serif" font-size="15px" font-weight="700" fill="#6c5ce7">Usa-la tranquil·lament</text>
  <text x="44" y="514" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5px" fill="#2d3436">Dins de l'if, el compilador ja sap que hi ha valor.</text>
  <rect x="44" y="522" width="404" height="26" rx="4" fill="#fbfbfe" stroke="#d5d5e0" stroke-width="1"/>
  <rect x="44" y="522" width="3" height="26" rx="1.5" fill="#6c5ce7"/>
  <text x="56" y="540" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve">nom.<tspan fill="#2b91af">Length</tspan>   <tspan fill="#008000" font-style="italic">// cap NullReferenceException</tspan></text>

  <!-- ================= OPERADORS (dreta) ================= -->
  <g filter="url(#ombra)">
    <rect x="484" y="148" width="282" height="412" rx="10" fill="#ffffff" stroke="#e3e1ef" stroke-width="1"/>
  </g>
  <rect x="484" y="148" width="282" height="5" rx="2.5" fill="#6c5ce7"/>
  <text x="500" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="15px" font-weight="700" fill="#6c5ce7">Els quatre operadors</text>

  <rect x="500" y="196" width="50" height="20" rx="10" fill="#efe9ff"/>
  <text x="525" y="210" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a"><tspan fill="#c0341d" font-weight="700">??</tspan></text>
  <text x="560" y="210" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5px" fill="#2d3436" font-weight="600">Valor per defecte</text>
  <text x="500" y="230" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve">nom ?? <tspan fill="#a31515">"Anònim"</tspan></text>
  <text x="500" y="246" font-family="'Segoe UI',Arial,sans-serif" font-size="10px" fill="#6b6b7b">Si és null, agafa el de la dreta.</text>

  <rect x="500" y="262" width="50" height="20" rx="10" fill="#efe9ff"/>
  <text x="525" y="276" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a"><tspan fill="#c0341d" font-weight="700">??=</tspan></text>
  <text x="560" y="276" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5px" fill="#2d3436" font-weight="600">Omple el forat</text>
  <text x="500" y="296" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve">intents ??= <tspan fill="#098658">3</tspan>;</text>
  <text x="500" y="312" font-family="'Segoe UI',Arial,sans-serif" font-size="10px" fill="#6b6b7b">Assigna només si val null.</text>

  <rect x="500" y="328" width="50" height="20" rx="10" fill="#efe9ff"/>
  <text x="525" y="342" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a"><tspan fill="#c0341d" font-weight="700">?.</tspan></text>
  <text x="560" y="342" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5px" fill="#2d3436" font-weight="600">Accés segur</text>
  <text x="500" y="362" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve">text?.<tspan fill="#2b91af">Length</tspan> ?? <tspan fill="#098658">0</tspan></text>
  <text x="500" y="378" font-family="'Segoe UI',Arial,sans-serif" font-size="10px" fill="#6b6b7b">Accedeix només si no és null.</text>

  <rect x="500" y="394" width="50" height="20" rx="10" fill="#ffe2de"/>
  <text x="525" y="408" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a"><tspan fill="#c0341d" font-weight="700">!</tspan></text>
  <text x="560" y="408" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5px" fill="#2d3436" font-weight="600">Perdó de null</text>
  <text x="500" y="428" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve">text!.<tspan fill="#2b91af">Length</tspan></text>
  <text x="500" y="444" font-family="'Segoe UI',Arial,sans-serif" font-size="10px" fill="#6b6b7b">Calla el compilador... i peta igual</text>
  <text x="500" y="458" font-family="'Segoe UI',Arial,sans-serif" font-size="10px" fill="#6b6b7b">si de debò era null.</text>

  <line x1="500" y1="474" x2="750" y2="474" stroke="#e3e1ef" stroke-width="1"/>
  <text x="500" y="494" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5px" fill="#2d3436" font-weight="600">Tipus per valor (int?, double?)</text>
  <text x="500" y="512" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve">nota.HasValue  <tspan fill="#008000" font-style="italic">// té valor?</tspan></text>
  <text x="500" y="528" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve">nota.Value     <tspan fill="#008000" font-style="italic">// el valor</tspan></text>
  <text x="500" y="546" font-family="'Segoe UI',Arial,sans-serif" font-size="10px" fill="#6b6b7b">En un string? no existeixen: fes != null.</text>

  <!-- ================= POST-IT TORT ================= -->
  <g transform="rotate(-4.5 640 610)" filter="url(#ombra)">
    <rect x="470" y="574" width="296" height="86" rx="6" fill="#fff6bf" stroke="#e8cf6a"/>
    <text x="486" y="600" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#8a6100">REGLA D'OR</text>
    <text x="486" y="620" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5px" fill="#2d3436" fill="#6b5400">Si la dada pot no existir → tipus amb  ?</text>
    <text x="486" y="638" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5px" fill="#2d3436" fill="#6b5400">Si sempre hi ha d'haver valor → sense  ?</text>
    <text x="486" y="652" font-family="'Segoe UI',Arial,sans-serif" font-size="10px" fill="#6b6b7b" fill="#8a7420">Posar ? a tot només trasllada el problema.</text>
  </g>

  <!-- ================= QUÈ POT SER NULL (esquerra baix) ================= -->
  <g filter="url(#ombra)">
    <rect x="28" y="576" width="420" height="150" rx="10" fill="#ffffff" stroke="#e3e1ef" stroke-width="1"/>
  </g>
  <rect x="28" y="576" width="420" height="5" rx="2.5" fill="#6c5ce7"/>
  <text x="44" y="606" font-family="'Segoe UI',Arial,sans-serif" font-size="15px" font-weight="700" fill="#6c5ce7">Què pot valer null?</text>

  <rect x="44" y="618" width="388" height="22" rx="4" fill="#f7f6fd"/>
  <text x="54" y="633" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a"><tspan fill="#0000ff" font-weight="700">int</tspan> edat</text>
  <text x="180" y="633" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#c0341d" font-weight="700">NO</text>
  <text x="230" y="633" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a"><tspan fill="#0000ff" font-weight="700">int</tspan>? edat</text>
  <text x="360" y="633" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#098658">SÍ</text>

  <rect x="44" y="644" width="388" height="22" rx="4" fill="#ffffff"/>
  <text x="54" y="659" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a"><tspan fill="#0000ff" font-weight="700">string</tspan> nom</text>
  <text x="180" y="659" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#c0341d" font-weight="700">NO</text>
  <text x="230" y="659" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a"><tspan fill="#0000ff" font-weight="700">string</tspan>? nom</text>
  <text x="360" y="659" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#098658">SÍ</text>

  <rect x="44" y="674" width="388" height="40" rx="4" fill="#fbfbfe" stroke="#d5d5e0" stroke-width="1"/>
  <rect x="44" y="674" width="3" height="40" rx="1.5" fill="#6c5ce7"/>
  <text x="56" y="690" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve"><tspan fill="#0000ff" font-weight="700">string</tspan>  c = <tspan fill="#0000ff" font-weight="700">null</tspan>;  <tspan fill="#c0341d" font-weight="700">// ERROR: no compila</tspan></text>
  <text x="56" y="706" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve"><tspan fill="#0000ff" font-weight="700">string</tspan>? d = <tspan fill="#0000ff" font-weight="700">null</tspan>;  <tspan fill="#008000" font-style="italic">// OK</tspan></text>

  <!-- ================= LLEGIR DEL TECLAT (ample) ================= -->
  <g filter="url(#ombra)">
    <rect x="28" y="742" width="738" height="168" rx="10" fill="#ffffff" stroke="#e3e1ef" stroke-width="1"/>
  </g>
  <rect x="28" y="742" width="738" height="5" rx="2.5" fill="#6c5ce7"/>
  <text x="44" y="772" font-family="'Segoe UI',Arial,sans-serif" font-size="15px" font-weight="700" fill="#6c5ce7">Llegir del teclat: Console.ReadLine() retorna string?</text>
  <text x="44" y="792" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5px" fill="#2d3436">Amb el mode Nullable actiu, tot el que escriu l'usuari arriba com a text que pot no existir.</text>

  <rect x="44" y="802" width="352" height="92" rx="4" fill="#fbfbfe" stroke="#d5d5e0" stroke-width="1"/>
  <rect x="44" y="802" width="3" height="92" rx="1.5" fill="#6c5ce7"/>
  <text x="56" y="820" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve"><tspan fill="#2b91af">Console</tspan>.<tspan fill="#74531f" font-weight="700">Write</tspan>(<tspan fill="#a31515">"Nom: "</tspan>);</text>
  <text x="56" y="836" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve"><tspan fill="#0000ff" font-weight="700">string</tspan>? nom = <tspan fill="#2b91af">Console</tspan>.<tspan fill="#74531f" font-weight="700">ReadLine</tspan>();</text>
  <text x="56" y="856" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve"><tspan fill="#0000ff" font-weight="700">if</tspan> (<tspan fill="#0000ff" font-weight="700">string</tspan>.<tspan fill="#74531f" font-weight="700">IsNullOrWhiteSpace</tspan>(nom))</text>
  <text x="56" y="872" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve">    <tspan fill="#2b91af">Console</tspan>.<tspan fill="#74531f" font-weight="700">WriteLine</tspan>(<tspan fill="#a31515">"Nom no vàlid!"</tspan>);</text>
  <text x="56" y="888" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve"><tspan fill="#0000ff" font-weight="700">else</tspan>  <tspan fill="#008000" font-style="italic">// aquí el compilador ja el dóna per bo</tspan></text>

  <rect x="412" y="802" width="338" height="42" rx="4" fill="#f3f1fe" stroke="#d6d1fa"/>
  <text x="426" y="820" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5px" font-weight="700" fill="#4a3fb8">Drecera quan el buit no importa</text>
  <text x="426" y="836" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve"><tspan fill="#0000ff" font-weight="700">string</tspan> nom = <tspan fill="#2b91af">Console</tspan>.<tspan fill="#74531f" font-weight="700">ReadLine</tspan>() ?? <tspan fill="#a31515">""</tspan>;</text>

  <text x="412" y="866" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5px" fill="#2d3436" font-weight="600">Tres estats ben diferents d'un text:</text>
  <text x="426" y="884" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve"><tspan fill="#0000ff" font-weight="700">null</tspan></text>
  <text x="470" y="884" font-family="'Segoe UI',Arial,sans-serif" font-size="10px" fill="#6b6b7b">cap text</text>
  <text x="560" y="884" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve"><tspan fill="#a31515">""</tspan></text>
  <text x="590" y="884" font-family="'Segoe UI',Arial,sans-serif" font-size="10px" fill="#6b6b7b">buit</text>
  <text x="640" y="884" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#1a1a1a" xml:space="preserve"><tspan fill="#a31515">"  "</tspan></text>
  <text x="680" y="884" font-family="'Segoe UI',Arial,sans-serif" font-size="10px" fill="#6b6b7b">espais</text>

  <!-- ================= ERRORS DEL COMPILADOR ================= -->
  <g filter="url(#ombra)">
    <rect x="28" y="926" width="738" height="120" rx="10" fill="#ffffff" stroke="#e3e1ef" stroke-width="1"/>
  </g>
  <rect x="28" y="926" width="738" height="5" rx="2.5" fill="#6c5ce7"/>
  <text x="44" y="956" font-family="'Segoe UI',Arial,sans-serif" font-size="15px" font-weight="700" fill="#6c5ce7">Si el compilador et crida l'atenció</text>

  <rect x="44" y="970" width="62" height="18" rx="9" fill="#ffe2de"/>
  <text x="75" y="983" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#c0341d" font-weight="700">CS8600</text>
  <text x="116" y="983" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5px" fill="#2d3436">Assignes un possible null a una variable sense ?</text>

  <rect x="44" y="996" width="62" height="18" rx="9" fill="#ffe2de"/>
  <text x="75" y="1009" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#c0341d" font-weight="700">CS8602</text>
  <text x="116" y="1009" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5px" fill="#2d3436">Uses una variable que pot ser null sense comprovar-la</text>

  <rect x="420" y="970" width="62" height="18" rx="9" fill="#ffe2de"/>
  <text x="451" y="983" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#c0341d" font-weight="700">CS8625</text>
  <text x="492" y="983" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5px" fill="#2d3436">Assignes null a un tipus que no l'admet</text>

  <rect x="420" y="996" width="62" height="18" rx="9" fill="#ffe2de"/>
  <text x="451" y="1009" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="11px" fill="#c0341d" font-weight="700">CS0165</text>
  <text x="492" y="1009" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5px" fill="#2d3436">Uses una variable abans de donar-li cap valor</text>

  <text x="44" y="1034" font-family="'Segoe UI',Arial,sans-serif" font-size="10px" fill="#6b6b7b">Al projecte hi ha un Directory.Build.props amb &lt;Nullable&gt;enable&lt;/Nullable&gt;: els avisos de null són errors i el programa no compila.</text>

  <text x="28" y="1072" font-family="'Segoe UI',Arial,sans-serif" font-size="10px" fill="#6b6b7b">Xuleta C# · els nulls</text>
  <text x="766" y="1072" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="10px" fill="#6b6b7b">Pòster SVG — editable amb Inkscape</text>
</svg>
